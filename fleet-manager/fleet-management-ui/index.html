<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetFlow | EV Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>FleetFlow</h1>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">EV Fleet & Charging Control</p>
            </div>
            <div class="status-badge">
                <div class="status-dot" id="api-status-dot"></div>
                <span id="api-status-text">Backend: Connecting...</span>
            </div>
        </header>

        <div class="grid">
            <!-- Add Vehicle Card -->
            <div class="card" style="animation-delay: 0.1s;">
                <h2>Register New Vehicle</h2>
                <form id="vehicle-form">
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 0.5rem;">
                            <label style="margin-bottom: 0;">VIN (Exactly 17 Characters)</label>
                            <span style="color: var(--accent-color); font-size: 0.75rem; cursor: pointer; font-weight: 600;" onclick="app.generateRandomVin()">✨ Generate Random</span>
                        </div>
                        <input type="text" id="vin" placeholder="ABC1234567890EFGH" minlength="17" maxlength="17" required>
                        <small id="vin-count" style="display: block; margin-top: 0.25rem; font-size: 0.75rem; color: var(--text-secondary);">0 / 17 characters</small>
                    </div>
                    <div class="form-group">
                        <label>Make</label>
                        <input type="text" id="make" placeholder="Tesla, Rivian, etc." required>
                    </div>
                    <div class="form-group">
                        <label>Model</label>
                        <input type="text" id="model" placeholder="Model 3, R1T, etc." required>
                    </div>
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" id="year" value="2024" min="1900" max="2026" required>
                    </div>
                    <button type="submit">Create Vehicle</button>
                </form>
            </div>

            <!-- Vehicle List & Sessions -->
            <div class="card" style="animation-delay: 0.2s; grid-column: span 1.5;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="margin-bottom: 0;">Active Fleet</h2>
                    <button class="secondary btn-sm" onclick="app.loadVehicles()">Refresh List</button>
                </div>
                <div id="vehicle-list-container">
                    <p style="color: var(--text-secondary); text-align: center; padding: 2rem;">Loading fleet data...</p>
                </div>
            </div>

            <!-- Policy Management (NEW) -->
            <div class="card" style="animation-delay: 0.3s; grid-column: span 2.5;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="margin-bottom: 0;">Policy Management</h2>
                    <div>
                        <button class="secondary btn-sm" onclick="app.searchPolicies()">Load Mock Search</button>
                        <button class="secondary btn-sm" onclick="app.viewPolicyDetails()">Load Mock Details</button>
                    </div>
                </div>
                <div id="policy-content" style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 0.5rem; max-height: 250px; overflow-y: auto;">
                    <p style="color: var(--text-secondary);">Click a button above to test the Policy APIs...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Message goes here</div>

    <script src="app.js" type="module"></script>
</body>
</html>
